<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Portfolio Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Plus+Jakarta+Sans:wght@500;800&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="portfolio.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <section class="section login-box">
    <h2>Admin login</h2>

    <form class="crud-form" id="login-form">
      <input type="text" id="username" placeholder="Username">
      <input type="password" id="password" placeholder="Password">
      <p class="error-text" id="login-error"></p>
      <button class="button" type="submit">Login</button>
    </form>

    <p class="admin-note"><a href="portfolio.html">Back to portfolio</a></p>
  </section>

  <script src="login.js"></script>

</body>
</html>
